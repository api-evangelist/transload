aid: transload
name: Transload
description: >-
  Transload (YC Spring 2026) measures freight with security cameras, turning
  the CCTV already installed in logistics warehouses into a 3D dimensioner for
  the loading dock. Its computer vision captures the true size of every pallet,
  couch, or tire as it moves through the warehouse — no new hardware or process
  changes — recovering rebilling revenue and trailer utilization for trucking
  companies (the company reports ~15% of shipments measure larger than
  declared). Founded 2026 in San Francisco by Nils Börner, Julius Scheel, and
  Jago Wahl-Schwentker (TU Munich). Its bearer-authenticated Pipeline Backend
  API is publicly described by an OpenAPI 3.0.3 served at
  api.transload.io/docs, covering customers, sites, cameras, scans, processing
  stages, AI measurement results, and customer handling-unit data.
