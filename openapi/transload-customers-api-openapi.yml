openapi: 3.2.0
info:
  title: Pipeline Backend Customers API
  version: 0.1.0
security:
- bearerAuth: []
tags:
- name: Customers
paths:
  /v1/customers:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                slug:
                  type: string
                  minLength: 1
                name:
                  type: string
                  minLength: 1
                storageProvider:
                  type: string
                  enum:
                  - azure_blob
                  - gcs
                  - localfs
                storageAccount:
                  type: string
                  minLength: 1
                storageContainer:
                  type: string
                  minLength: 1
                logoUrl:
                  type: string
                  format: uri
                  minLength: 1
                metadata:
                  type: object
                  additionalProperties: {}
              required:
              - slug
              - name
      responses:
        '200':
          description: Default Response
      tags:
      - Customers
      summary: Create customers
      x-summary-source: derived
      operationId: postV1Customers
      x-operation-id-source: derived
    get:
      responses:
        '200':
          description: Default Response
      tags:
      - Customers
      summary: Get customers
      x-summary-source: derived
      operationId: getV1Customers
      x-operation-id-source: derived
  /v1/customers/{customerId}:
    get:
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: customerId
        required: true
      responses:
        '200':
          description: Default Response
      tags:
      - Customers
      summary: Get customers by customer id
      x-summary-source: derived
      operationId: getV1CustomersByCustomerId
      x-operation-id-source: derived
    patch:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                slug:
                  type: string
                  minLength: 1
                status:
                  type: string
                  enum:
                  - active
                  - disabled
                storageProvider:
                  type:
                  - string
                  - 'null'
                  enum:
                  - azure_blob
                  - gcs
                  - localfs
                storageAccount:
                  type:
                  - string
                  - 'null'
                  minLength: 1
                storageContainer:
                  type:
                  - string
                  - 'null'
                  minLength: 1
                logoUrl:
                  type:
                  - string
                  - 'null'
                  format: uri
                  minLength: 1
                metadata:
                  type: object
                  additionalProperties: {}
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: customerId
        required: true
      responses:
        '200':
          description: Default Response
      tags:
      - Customers
      summary: Update customers by customer id
      x-summary-source: derived
      operationId: patchV1CustomersByCustomerId
      x-operation-id-source: derived
    delete:
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: customerId
        required: true
      responses:
        '200':
          description: Default Response
      tags:
      - Customers
      summary: Delete customers by customer id
      x-summary-source: derived
      operationId: deleteV1CustomersByCustomerId
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
