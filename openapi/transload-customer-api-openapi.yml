openapi: 3.2.0
info:
  title: Pipeline Backend Customer API
  version: 0.1.0
security:
- bearerAuth: []
tags:
- name: Customer
paths:
  /v1/customer/auth/request-link:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
              required:
              - email
      responses:
        '200':
          description: Default Response
      tags:
      - Customer
      summary: Create customer auth request link
      x-summary-source: derived
      operationId: postV1CustomerAuthRequestLink
      x-operation-id-source: derived
  /v1/customer/auth/verify:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  minLength: 10
                otp:
                  type: string
              required:
              - token
      responses:
        '200':
          description: Default Response
      tags:
      - Customer
      summary: Create customer auth verify
      x-summary-source: derived
      operationId: postV1CustomerAuthVerify
      x-operation-id-source: derived
  /v1/customer/auth/select-customer:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customerId:
                  type: string
                  format: uuid
              required:
              - customerId
      responses:
        '200':
          description: Default Response
      tags:
      - Customer
      summary: Create customer auth select customer
      x-summary-source: derived
      operationId: postV1CustomerAuthSelectCustomer
      x-operation-id-source: derived
  /v1/customer/auth/logout:
    post:
      responses:
        '200':
          description: Default Response
      tags:
      - Customer
      summary: Create customer auth logout
      x-summary-source: derived
      operationId: postV1CustomerAuthLogout
      x-operation-id-source: derived
  /v1/customer/auth/session:
    get:
      responses:
        '200':
          description: Default Response
      tags:
      - Customer
      summary: Get customer auth session
      x-summary-source: derived
      operationId: getV1CustomerAuthSession
      x-operation-id-source: derived
  /v1/customer/data/handling-units:
    get:
      responses:
        '200':
          description: Default Response
      tags:
      - Customer
      summary: Get customer data handling units
      x-summary-source: derived
      operationId: getV1CustomerDataHandlingUnits
      x-operation-id-source: derived
  /v1/customer/data/handling-units/export:
    get:
      responses:
        '200':
          description: Default Response
      tags:
      - Customer
      summary: Get customer data handling units export
      x-summary-source: derived
      operationId: getV1CustomerDataHandlingUnitsExport
      x-operation-id-source: derived
  /v1/customer/data/shipments/{shipmentId}:
    get:
      parameters:
      - schema:
          type: string
        in: path
        name: shipmentId
        required: true
      responses:
        '200':
          description: Default Response
      tags:
      - Customer
      summary: Get customer data shipments by shipment id
      x-summary-source: derived
      operationId: getV1CustomerDataShipmentsByShipmentId
      x-operation-id-source: derived
  /v1/customer/data/handling-units/{handlingUnitId}:
    get:
      parameters:
      - schema:
          type: string
        in: path
        name: handlingUnitId
        required: true
      responses:
        '200':
          description: Default Response
      tags:
      - Customer
      summary: Get customer data handling units by handling unit id
      x-summary-source: derived
      operationId: getV1CustomerDataHandlingUnitsByHandlingUnitId
      x-operation-id-source: derived
    delete:
      parameters:
      - schema:
          type: string
        in: path
        name: handlingUnitId
        required: true
      responses:
        '200':
          description: Default Response
      tags:
      - Customer
      summary: Delete customer data handling units by handling unit id
      x-summary-source: derived
      operationId: deleteV1CustomerDataHandlingUnitsByHandlingUnitId
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
