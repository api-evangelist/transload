openapi: 3.2.0
info:
  title: Pipeline Backend Sites API
  version: 0.1.0
security:
- bearerAuth: []
tags:
- name: Sites
paths:
  /v1/sites:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customerId:
                  type: string
                  format: uuid
                slug:
                  type: string
                  minLength: 1
                name:
                  type: string
                  minLength: 1
                address:
                  type:
                  - string
                  - 'null'
                  minLength: 1
                timezone:
                  type: string
                  minLength: 1
                  default: UTC
                metadata:
                  type: object
                  additionalProperties: {}
                scanSource:
                  type:
                  - string
                  - 'null'
                  enum:
                  - db
                  - scandrop
                customerDatabase:
                  type:
                  - object
                  - 'null'
                  properties:
                    scanQuery:
                      type:
                      - string
                      - 'null'
                    scanQueryAutodetect:
                      type: boolean
                      default: false
                    timezone:
                      type: string
                      minLength: 1
                      default: UTC
                scanFields:
                  type:
                  - object
                  - 'null'
                  properties:
                    xField:
                      type: string
                      default: locXPos
                    yField:
                      type: string
                      default: locYPos
                    zField:
                      type:
                      - string
                      - 'null'
                      default: null
                    zDefaultCm:
                      type: number
                      default: 100
                    zoneField:
                      type:
                      - string
                      - 'null'
                      default: null
                    handlingUnitField:
                      type: string
                      default: handlingUnitId
                    shipmentField:
                      type:
                      - string
                      - 'null'
                      default: null
                captureConfig:
                  type:
                  - object
                  - 'null'
                  properties:
                    pollIntervalSeconds:
                      type: number
                      default: 2
                    toleranceSeconds:
                      type: number
                      default: 2
                    scanLookbackSeconds:
                      type: number
                      default: 300
                    localFrameTtlHours:
                      type: number
                      default: 48
                    bufferHardMaxSeconds:
                      type: number
                      default: 600
                    bufferFps:
                      type: number
                      default: 30
                    fovMarginSide:
                      type: number
                      default: 0.05
                    fovMarginTop:
                      type: number
                      default: 0.2
                scandropConfig:
                  type:
                  - object
                  - 'null'
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    directory:
                      type: string
                    processedDirectory:
                      type: string
              required:
              - customerId
              - name
      responses:
        '200':
          description: Default Response
      tags:
      - Sites
      summary: Create sites
      x-summary-source: derived
      operationId: postV1Sites
      x-operation-id-source: derived
    get:
      parameters:
      - schema:
          type: string
          format: uuid
        in: query
        name: customerId
        required: false
      responses:
        '200':
          description: Default Response
      tags:
      - Sites
      summary: Get sites
      x-summary-source: derived
      operationId: getV1Sites
      x-operation-id-source: derived
  /v1/sites/{siteId}:
    get:
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: siteId
        required: true
      responses:
        '200':
          description: Default Response
      tags:
      - Sites
      summary: Get sites by site id
      x-summary-source: derived
      operationId: getV1SitesBySiteId
      x-operation-id-source: derived
    patch:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                slug:
                  type: string
                  minLength: 1
                address:
                  type:
                  - string
                  - 'null'
                  minLength: 1
                timezone:
                  type: string
                  minLength: 1
                metadata:
                  type: object
                  additionalProperties: {}
                scanSource:
                  type:
                  - string
                  - 'null'
                  enum:
                  - db
                  - scandrop
                customerDatabase:
                  type:
                  - object
                  - 'null'
                  properties:
                    scanQuery:
                      type:
                      - string
                      - 'null'
                    scanQueryAutodetect:
                      type: boolean
                      default: false
                    timezone:
                      type: string
                      minLength: 1
                      default: UTC
                scanFields:
                  type:
                  - object
                  - 'null'
                  properties:
                    xField:
                      type: string
                      default: locXPos
                    yField:
                      type: string
                      default: locYPos
                    zField:
                      type:
                      - string
                      - 'null'
                      default: null
                    zDefaultCm:
                      type: number
                      default: 100
                    zoneField:
                      type:
                      - string
                      - 'null'
                      default: null
                    handlingUnitField:
                      type: string
                      default: handlingUnitId
                    shipmentField:
                      type:
                      - string
                      - 'null'
                      default: null
                captureConfig:
                  type:
                  - object
                  - 'null'
                  properties:
                    pollIntervalSeconds:
                      type: number
                      default: 2
                    toleranceSeconds:
                      type: number
                      default: 2
                    scanLookbackSeconds:
                      type: number
                      default: 300
                    localFrameTtlHours:
                      type: number
                      default: 48
                    bufferHardMaxSeconds:
                      type: number
                      default: 600
                    bufferFps:
                      type: number
                      default: 30
                    fovMarginSide:
                      type: number
                      default: 0.05
                    fovMarginTop:
                      type: number
                      default: 0.2
                scandropConfig:
                  type:
                  - object
                  - 'null'
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    directory:
                      type: string
                    processedDirectory:
                      type: string
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: siteId
        required: true
      responses:
        '200':
          description: Default Response
      tags:
      - Sites
      summary: Update sites by site id
      x-summary-source: derived
      operationId: patchV1SitesBySiteId
      x-operation-id-source: derived
    delete:
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: siteId
        required: true
      responses:
        '200':
          description: Default Response
      tags:
      - Sites
      summary: Delete sites by site id
      x-summary-source: derived
      operationId: deleteV1SitesBySiteId
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
