openapi: 3.2.0
info:
  title: Pipeline Backend Reference Measurements API
  version: 0.1.0
security:
- bearerAuth: []
tags:
- name: Reference Measurements
paths:
  /v1/reference-measurements:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customerId:
                  type: string
                  format: uuid
                matchedBy:
                  type: string
                  enum:
                  - customer_scan_id
                  - handling_unit_id
                  - shipment_id
                  - frame_request_id
                matchedValue:
                  type: string
                  minLength: 1
                lengthCm:
                  type: integer
                widthCm:
                  type: integer
                heightCm:
                  type: integer
                sourceSystem:
                  type: string
                  minLength: 1
                sourceRecordId:
                  type: string
                  minLength: 1
                importBatchId:
                  type: string
                  minLength: 1
              required:
              - customerId
              - matchedBy
              - matchedValue
              - lengthCm
              - widthCm
              - heightCm
              - sourceSystem
      responses:
        '200':
          description: Default Response
      tags:
      - Reference Measurements
      summary: Create reference measurements
      x-summary-source: derived
      operationId: postV1ReferenceMeasurements
      x-operation-id-source: derived
    get:
      parameters:
      - schema:
          type: string
          format: uuid
        in: query
        name: customerId
        required: true
      - schema:
          type: string
          format: uuid
        in: query
        name: scanId
        required: false
      responses:
        '200':
          description: Default Response
      tags:
      - Reference Measurements
      summary: Get reference measurements
      x-summary-source: derived
      operationId: getV1ReferenceMeasurements
      x-operation-id-source: derived
  /v1/reference-measurements/{id}:
    get:
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: id
        required: true
      responses:
        '200':
          description: Default Response
      tags:
      - Reference Measurements
      summary: Get reference measurements by id
      x-summary-source: derived
      operationId: getV1ReferenceMeasurementsById
      x-operation-id-source: derived
    delete:
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: id
        required: true
      responses:
        '200':
          description: Default Response
      tags:
      - Reference Measurements
      summary: Delete reference measurements by id
      x-summary-source: derived
      operationId: deleteV1ReferenceMeasurementsById
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
