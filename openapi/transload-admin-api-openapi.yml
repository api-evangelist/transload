      responses:
        '200':
          description: Default Response
      tags:
      - Admin
  /v1/admin/pipeline/customer-resume:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customerId:
                  type: string
                  format: uuid
                stage:
                  type: string
                  enum:
                  - dewarping
                  - classification
                  - measurement
              required:
              - customerId
              - stage
      responses:
        '200':
          description: Default Response
      tags:
      - Admin
  /v1/admin/pipeline/customer-reset:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customerId:
                  type: string
                  format: uuid
                stage:
                  type: string
                  enum:
                  - dewarping
                  - classification
                  - measurement
                reason:
                  type: string
                  default: manual customer stage reset
              required:
              - customerId
              - stage
      responses:
        '200':
          description: Default Response
      tags:
      - Admin
  /admin:
    get:
      responses:
        '200':
          description: Default Response
      tags:
      - Admin
  /admin/resources/{resourceId}:
    get:
      parameters:
      - schema:
          type: string
        in: path
        name: resourceId
        required: true
      responses:
        '200':
          description: Default Response
      tags:
      - Admin
  /admin/api/resources/{resourceId}/search/{query}:
    get:
      parameters:
      - schema:
          type: string
        in: path
