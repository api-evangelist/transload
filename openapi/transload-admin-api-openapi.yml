openapi: 3.0.3
info:
  title: Pipeline Backend Admin API
  version: 0.1.0
security:
- bearerAuth: []
tags:
- name: Admin
paths:
  /v1/admin/overview:
    get:
      parameters:
      - schema:
          type: string
          format: date-time
        in: query
        name: since
        required: false
      responses:
        '200':
          description: Default Response
      tags:
      - Admin
  /v1/admin/pipeline/gates:
    get:
      responses:
        '200':
          description: Default Response
      tags:
      - Admin
  /v1/admin/pipeline/pause:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stage:
                  type: string
                  enum:
                  - dewarping
                  - classification
                  - measurement
                reason:
                  type: string
              required:
              - stage
      responses:
        '200':
          description: Default Response
      tags:
      - Admin
  /v1/admin/pipeline/resume:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stage:
                  type: string
                  enum:
                  - dewarping
                  - classification
                  - measurement
              required:
              - stage
      responses:
        '200':
          description: Default Response
      tags:
      - Admin
  /v1/admin/pipeline/customer-gates:
    get:
      responses:
        '200':
          description: Default Response
      tags:
      - Admin
  /v1/admin/pipeline/effective-gates:
    get:
      parameters:
      - schema:
          type: string
          format: uuid
        in: query
        name: customerId
        required: true
      responses:
        '200':
          description: Default Response
      tags:
      - Admin
  /v1/admin/pipeline/customer-pause:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customerId:
                  type: string
                  format: uuid
                stage:
                  type: string
                  enum:
                  - dewarping
                  - classification
                  - measurement
                reason:
