openapi: 3.2.0
info:
  title: Pipeline Backend Cameras API
  version: 0.1.0
security:
- bearerAuth: []
tags:
- name: Cameras
paths:
  /v1/cameras:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customerId:
                  type: string
                  format: uuid
                siteId:
                  type: string
                  format: uuid
                externalId:
                  type: string
                  minLength: 1
                name:
                  type: string
                  minLength: 1
                cameraType:
                  type: string
                  enum:
                  - rtsp
                  - http_snapshot
                  - other
                vendor:
                  type: string
                model:
                  type: string
                zones:
                  type: array
                  items:
                    type: string
                    minLength: 1
                metadata:
                  type: object
                  additionalProperties: {}
                intrinsics:
                  type:
                  - object
                  - 'null'
                  properties:
                    fx:
                      type: number
                    fy:
                      type: number
                    cx:
                      type: number
                    cy:
                      type: number
                    k1:
                      type: number
                      default: 0
                    k2:
                      type: number
                      default: 0
                    p1:
                      type: number
                      default: 0
                    p2:
                      type: number
                      default: 0
                    k3:
                      type: number
                      default: 0
                    imageWidth:
                      type: integer
                    imageHeight:
                      type: integer
                  required:
                  - fx
                  - fy
                  - cx
                  - cy
                  - imageWidth
                  - imageHeight
                intrinsicsUndistorted:
                  type:
                  - object
                  - 'null'
                  properties:
                    fx:
                      type: number
                    fy:
                      type: number
                    cx:
                      type: number
                    cy:
                      type: number
                    width:
                      type: integer
                    height:
                      type: integer
                  required:
                  - fx
                  - fy
                  - cx
                  - cy
                  - width
                  - height
                extrinsics:
                  type:
                  - object
                  - 'null'
                  properties:
                    rvec: {}
                    tvec: {}
                  required:
                  - rvec
                  - tvec
                measurementConfig:
                  type:
                  - object
                  - 'null'
                  additionalProperties:
                    type: object
                    additionalProperties: {}
                config:
                  type: object
                  properties:
                    url:
                      type: string
                      minLength: 1
                    username:
                      type:
                      - string
                      - 'null'
                    password:
                      type:
                      - string
                      - 'null'
                    bufferSeconds:
                      type:
                      - number
                      - 'null'
                    httpPollIntervalSeconds:
                      type:
                      - number
                      - 'null'
                    networkOffsetMs:
                      oneOf:
                      - type: integer
                      - enum:
                        - auto
                    zones:
                      type:
                      - array
                      - 'null'
                      items:
                        type: string
                        minLength: 1
                    rtspTimestampSource:
                      type:
                      - string
                      - 'null'
                      enum:
                      - wall_clock
                      - rtcp_ntp
                      - camera_metadata
                    encodingOffsetMs:
                      type:
                      - integer
                      - 'null'
                    cameraMetadataUrl:
                      type:
                      - string
                      - 'null'
                    onvifDeviceServiceUrl:
                      type:
                      - string
                      - 'null'
                    scanArea:
                      type:
                      - object
                      - 'null'
                      additionalProperties: {}
                  required:
                  - url
              required:
              - customerId
              - siteId
              - name
              - cameraType
      responses:
        '200':
          description: Default Response
      tags:
      - Cameras
      summary: Create cameras
      x-summary-source: derived
      operationId: postV1Cameras
      x-operation-id-source: derived
    get:
      parameters:
      - schema:
          type: string
          format: uuid
        in: query
        name: customerId
        required: false
      - schema:
          type: string
          format: uuid
        in: query
        name: siteId
        required: false
      responses:
        '200':
          description: Default Response
      tags:
      - Cameras
      summary: Get cameras
      x-summary-source: derived
      operationId: getV1Cameras
      x-operation-id-source: derived
  /v1/cameras/{cameraId}:
    get:
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: cameraId
        required: true
      responses:
        '200':
          description: Default Response
      tags:
      - Cameras
      summary: Get cameras by camera id
      x-summary-source: derived
      operationId: getV1CamerasByCameraId
      x-operation-id-source: derived
    patch:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                cameraType:
                  type: string
                  enum:
                  - rtsp
                  - http_snapshot
                  - other
                status:
                  type: string
                  enum:
                  - active
                  - inactive
                  - retired
                vendor:
                  type: string
                model:
                  type: string
                zones:
                  type:
                  - array
                  - 'null'
                  items:
                    type: string
                    minLength: 1
                metadata:
                  type: object
                  additionalProperties: {}
                intrinsics:
                  type:
                  - object
                  - 'null'
                  properties:
                    fx:
                      type: number
                    fy:
                      type: number
                    cx:
                      type: number
                    cy:
                      type: number
                    k1:
                      type: number
                      default: 0
                    k2:
                      type: number
                      default: 0
                    p1:
                      type: number
                      default: 0
                    p2:
                      type: number
                      default: 0
                    k3:
                      type: number
                      default: 0
                    imageWidth:
                      type: integer
                    imageHeight:
                      type: integer
                  required:
                  - fx
                  - fy
                  - cx
                  - cy
                  - imageWidth
                  - imageHeight
                intrinsicsUndistorted:
                  type:
                  - object
                  - 'null'
                  properties:
                    fx:
                      type: number
                    fy:
                      type: number
                    cx:
                      type: number
                    cy:
                      type: number
                    width:
                      type: integer
                    height:
                      type: integer
                  required:
                  - fx
                  - fy
                  - cx
                  - cy
                  - width
                  - height
                extrinsics:
                  type:
                  - object
                  - 'null'
                  properties:
                    rvec: {}
                    tvec: {}
                  required:
                  - rvec
                  - tvec
                measurementConfig:
                  type:
                  - object
                  - 'null'
                  additionalProperties:
                    type: object
                    additionalProperties: {}
                config:
                  type:
                  - object
                  - 'null'
                  properties:
                    url:
                      type: string
                      minLength: 1
                    username:
                      type:
                      - string
                      - 'null'
                    password:
                      type:
                      - string
                      - 'null'
                    bufferSeconds:
                      type:
                      - number
                      - 'null'
                    httpPollIntervalSeconds:
                      type:
                      - number
                      - 'null'
                    networkOffsetMs:
                      oneOf:
                      - type: integer
                      - enum:
                        - auto
                    zones:
                      type:
                      - array
                      - 'null'
                      items:
                        type: string
                        minLength: 1
                    rtspTimestampSource:
                      type:
                      - string
                      - 'null'
                      enum:
                      - wall_clock
                      - rtcp_ntp
                      - camera_metadata
                    encodingOffsetMs:
                      type:
                      - integer
                      - 'null'
                    cameraMetadataUrl:
                      type:
                      - string
                      - 'null'
                    onvifDeviceServiceUrl:
                      type:
                      - string
                      - 'null'
                    scanArea:
                      type:
                      - object
                      - 'null'
                      additionalProperties: {}
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: cameraId
        required: true
      responses:
        '200':
          description: Default Response
      tags:
      - Cameras
      summary: Update cameras by camera id
      x-summary-source: derived
      operationId: patchV1CamerasByCameraId
      x-operation-id-source: derived
    delete:
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: cameraId
        required: true
      responses:
        '200':
          description: Default Response
      tags:
      - Cameras
      summary: Delete cameras by camera id
      x-summary-source: derived
      operationId: deleteV1CamerasByCameraId
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
